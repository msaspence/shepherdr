  <rect x="380" y="296" width="560" height="12" rx="6" fill="#2f333b"/>
  <rect x="380" y="320" width="480" height="12" rx="6" fill="#2f333b"/>
  <rect x="380" y="640" width="740" height="80" rx="14" fill="#1d2026" stroke="#3a3e47"/>
