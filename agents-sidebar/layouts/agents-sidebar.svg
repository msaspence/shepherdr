    <rect x="236" y="306" width="11" height="9" rx="1.5"/><rect x="236" y="366" width="11" height="9" rx="1.5"/><rect x="236" y="398" width="11" height="9" rx="1.5"/><rect x="236" y="456" width="11" height="9" rx="1.5"/><rect x="236" y="488" width="11" height="9" rx="1.5"/>
