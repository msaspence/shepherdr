  <line x1="0" y1="672.5" x2="268" y2="672.5" stroke="#2a2d34"/>
  <circle cx="23" cy="696" r="5.5" fill="none" stroke="#8a8f98" stroke-width="1.5"/><text x="39" y="700" font-size="13" fill="#9aa0a8">Settings</text>
  <text x="18" y="730" font-size="15" fill="#6b7079">+</text><text x="39" y="729" font-size="13" fill="#6b7079">Add machine</text>

  <!-- The selected agent's chat -->
  <rect x="760" y="80" width="360" height="52" rx="16" fill="#2a2d34"/>
